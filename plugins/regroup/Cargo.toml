[package]
name = "defiance-plugin-regroup"
version = "0.1.0"
license = "MPL-2.0"
edition = "2021"

# Experimental add-on in its own workspace; packaged with the loader, opt-in.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
defiance-api = { path = "../../crates/api" }
defiance-feature-sdk = { path = "../../crates/feature-sdk" }
defiance-core = { path = "../../crates/core" }

[build-dependencies]
defiance-build-support = { path = "../../crates/build-support" }

[profile.release]
opt-level = "s"
panic = "abort"
debug = 2
