[package]
name = "defiance-plugin-weapon-drops"
version = "0.3.0"
license = "MPL-2.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
parity-test = []

[dependencies]
defiance-api = { path = "../../crates/api" }
defiance-core = { path = "../../crates/core" }
defiance-feature-sdk = { path = "../../crates/feature-sdk" }

[build-dependencies]
defiance-build-support = { path = "../../crates/build-support" }

[profile.release]
panic = "abort"
debug = 2
