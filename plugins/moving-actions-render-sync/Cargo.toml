[package]
name = "defiance-plugin-moving-actions-render-sync"
version = "0.1.7"
edition = "2021"
license = "MPL-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
defiance-api = { path = "../../crates/api" }
defiance-core = { path = "../../crates/core" }
defiance-feature-sdk = { path = "../../crates/feature-sdk" }

[build-dependencies]
defiance-build-support = { path = "../../crates/build-support" }

# Tests build with this profile. The site tests scan every build's game DLLs,
# which unoptimized takes about a minute per workspace; optimized, a few seconds.
# Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 2

[profile.release]
panic = "abort"
debug = 2
