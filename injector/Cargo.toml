[package]
name = "defiance-pickup-inject"
version = "0.1.0"
license = "MPL-2.0"
edition = "2021"

# The shared core supplies patching and SHA-256; the SDK supplies embedded
# unit records. Win32 calls are declared inline, with no crates.io dependencies.
[dependencies]
defiance-core = { path = "../crates/core" }
defiance-feature-sdk = { path = "../crates/feature-sdk" }

[build-dependencies]
defiance-build-support = { path = "../crates/build-support" }

[[bin]]
name = "defiance-pickup-inject"
path = "src/main.rs"

# The release profile is the workspace's (opt-level "s", lto, panic abort,
# strip). A profile here would be ignored and warn, so there is none.
