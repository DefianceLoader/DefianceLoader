; A config fixture with the parser's quirks: an inline comment, a quoted
; value holding `;`, `#` and `=`, a duplicate key (last wins), and a UTF-8
; value with spaces.

[defiance.example]
greeting = hello ; an inline comment
quoted = "a; b # c = d"
path = "C:\Games\My Game\bin"
duplicate = first
duplicate = second

[author.demo]
enabled = true
