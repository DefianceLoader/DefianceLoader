[package]
name = "defiance-plugin-host-test"
version = "0.1.0"
license = "MPL-2.0"
edition = "2021"
autobins = false

[[bin]]
name = "defiance-plugin-host-test"
path = "src/main.rs"

[[bin]]
name = "service-host"
path = "src/bin/service-host.rs"

[[bin]]
name = "patch-inventory"
path = "src/bin/patch-inventory.rs"

[dependencies]
defiance-api = { path = "../../crates/api" }
defiance-core = { path = "../../crates/core" }
defiance-loader = { path = "../../crates/loader", features = ["test-host"] }
defiance-plugin-core = { path = "../../plugins/core", features = ["test-host"], optional = true }

[features]
patch-v1-test = ["dep:defiance-plugin-core"]
