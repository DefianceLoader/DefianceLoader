# Tools and one-command runs for the patch, from the repository root.
#
#   mise run setup    once: the Python libraries the tools use, into .venv
#   mise run worktree-init   in a new git worktree: copy the untracked game
#                     DLLs and local settings from the main checkout, build its
#                     graft graph when graft is installed, then setup
#   mise run inject   assemble every patch, build the injector, then wait for
#                     the game and patch it
#   mise run test     assemble, build, run every native test and the injector's
#                     self test
#   mise run probe    read the selection trace from the running game
#   mise run fmt      format every Rust workspace (default rustfmt); test and
#                     loader-infra-test fail on unformatted code
#   mise run bump     list component versions; `mise run bump patch loader`,
#                     `mise run bump minor features`, `mise run bump check`
#                     (tools/bump.py)
#   mise run watch    rebuild what the tests build on every save burst, ahead
#                     of time; results in out/watch/status.json
#   mise run test-quick   format, Rust tests of every workspace, versions,
#                     layouts and variants; minutes, not the full suite
#   mise run comment-audit   comments to review for staleness (report only;
#                     the tests run its --check)
#
# The built-in plugins and injector embed units from tools/variants, which is
# tracked, so a checkout builds without the game's DLLs. `build` runs `assemble`
# first: available DLL lineages refresh their payloads when inputs change;
# missing lineages use committed payloads. Every normal build checks injector
# coverage, self-tests it and scans the available supported DLL pairs.

[tools]
python = "3.12"
# rust-analyzer for editors; clippy for `bacon clippy`.
rust = { version = "stable", components = "rust-analyzer,clippy,rustfmt" }
# A background checker: `bacon` rebuilds on save (see bacon.toml).
"cargo:bacon" = "3.25.0"
# Rebuilds ahead of time on every save burst: `mise run watch` (tools/watch.py).
"aqua:watchexec/watchexec" = "2.7.3"
# The JDK Ghidra runs on (see the http:ghidra entry below).
java = "21"

# Ghidra, to read the game as decompiled C. It is an
# application, not a single binary mise can fetch by name, so the http backend
# takes the release zip directly. The URL names a build date, so it
# is fixed for this version and the checksum pins it; changing the version means
# a new URL. It needs the JDK above, which mise puts on PATH when it runs.
[tools."http:ghidra"]
version = "12.1.4"
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
checksum = "sha256:ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
strip_components = 1
bin_path = "support"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the Python libraries the tools use into .venv"
# tools/install_libs.py runs pip with .venv's own interpreter.
run = "python tools/install_libs.py"

[tasks.worktree-init]
description = "In a new git worktree: copy the untracked files the main checkout has, build the graft graph, then install the Python libraries"
run = ["python tools/worktree_init.py", "python tools/install_libs.py"]

[tasks.assemble]
description = "Refresh reference payloads and every available build's units (cached by inputs and outputs)"
# tools/stamp.py tracks sources, layouts, DLL lineages and generated units;
# DEFIANCE_NO_STAMP=1 forces reassembly.
run = "python tools/stamp.py assemble"

[tasks.variants]
description = "Assemble and resolve the per-build payloads named in tools/layouts (needs those builds' DLLs)"
# Every layout in tools/layouts, with its build's DLLs from bin/ (tools/builds.py).
run = "python tools/builds.py variants"

# Cargo workspaces: the loader's, the standalone plugins', the service
# examples' and the crash test plugin's. The generators that write Rust
# (tools/*_bindings.py, proxy.py) format their output too.
[tasks.fmt]
description = "Format every Rust workspace with default rustfmt"
run = [
  "cargo fmt --all --manifest-path Cargo.toml",
  "cargo fmt --all --manifest-path plugins/regroup/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/expanded-ammo-menu/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/squad-management-scroll/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/unit-inspection/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/ability-groups/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/legion-vehicle-hacking/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/vehicle-arrival/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/weapon-drops/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/cover-markers/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/moving-actions/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/moving-actions-animation/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/moving-actions-sync/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/moving-actions-render-sync/Cargo.toml",
  "cargo fmt --all --manifest-path plugins/moving-grenades/Cargo.toml",
  "cargo fmt --all --manifest-path examples/services/Cargo.toml",
  "cargo fmt --all --manifest-path tools/crash-plugin/Cargo.toml",
]

[tasks.fmt-check]
description = "Fail if any Rust workspace is not rustfmt-formatted (mise run fmt fixes it)"
run = """python tools/parallel.py \
  "cargo fmt --all --check --manifest-path Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/regroup/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/expanded-ammo-menu/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/squad-management-scroll/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/unit-inspection/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/ability-groups/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/legion-vehicle-hacking/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/vehicle-arrival/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/weapon-drops/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/cover-markers/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/moving-actions/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/moving-actions-animation/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/moving-actions-sync/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/moving-actions-render-sync/Cargo.toml" \
  "cargo fmt --all --check --manifest-path plugins/moving-grenades/Cargo.toml" \
  "cargo fmt --all --check --manifest-path examples/services/Cargo.toml" \
  "cargo fmt --all --check --manifest-path tools/crash-plugin/Cargo.toml"
"""

# A component's version is in its Cargo.toml, its lockfile and the manifest the
# loader checks it against (Core's built-in table or the committed .plugin.json); this
# changes them together. Arguments pass through: `mise run bump patch loader`.
[tasks.bump]
description = "List component versions, or bump them together: mise run bump <major|minor|patch|X.Y.Z> <component...> (see tools/bump.py)"
run = "python tools/bump.py"

# Keep this running in a terminal while working: after each burst of saves it
# runs the builds the test tasks run (tools/watch.py), so they start warm.
# watchexec restarts a pass when files change again mid-build.
[tasks.watch]
description = "Rebuild ahead of time on every save burst; status in out/watch/status.json"
run = "watchexec --shell=none --restart --debounce 3s --watch crates --watch plugins --watch patch --watch tools --watch injector --watch Cargo.toml --exts rs,toml,asm,py,json --ignore **/target/** --ignore **/__pycache__/** --ignore tools/variants/** -- python tools/watch.py"
raw = true

# Rust unit tests of every workspace, without the payload-dependent native
# suites. Pair it with `watch`, which has already built the test binaries.
[tasks.test-rust]
description = "Run the Rust tests of the main workspace and the standalone plugin workspaces"
depends = ["assemble"]
run = [
  "cargo test --workspace",
  "cargo test -p defiance-plugin-core --features inspect-probe inspect_probe",
  "cargo test --manifest-path plugins/regroup/Cargo.toml",
  "cargo test --manifest-path plugins/expanded-ammo-menu/Cargo.toml",
  "cargo test --manifest-path plugins/squad-management-scroll/Cargo.toml",
  "cargo test --manifest-path plugins/unit-inspection/Cargo.toml",
  "cargo test --manifest-path plugins/ability-groups/Cargo.toml",
  "cargo test --manifest-path plugins/legion-vehicle-hacking/Cargo.toml",
  "cargo test --manifest-path plugins/vehicle-arrival/Cargo.toml",
  "cargo test --manifest-path plugins/weapon-drops/Cargo.toml",
  "cargo test --manifest-path plugins/cover-markers/Cargo.toml",
]

[tasks.test-quick]
description = "Format check, every workspace's Rust tests, versions, layouts and variants (cached); run the full test before committing"
depends = ["fmt-check", "test-rust", "test-quick-python"]

# test-quick's Python checks, run at once (tools/parallel.py) and beside the
# Rust tests: none runs cargo, and none reads what another writes.
# test_variant.py writes only its own out/payload-<layout>.* and out/units-<layout>/.
[tasks.test-quick-python]
description = "The Python checks of test-quick, run in parallel"
hide = true
depends = ["assemble"]
run = """python tools/parallel.py \
  "python tools/comment_audit.py --check" \
  "python tools/test_builds.py" \
  "python tools/test_stamp.py" \
  "python tools/test_check_injector.py" \
  "python tools/check_injector.py --metadata-only" \
  "python tools/test_versions.py" \
  "python tools/test_layout.py" \
  "python tools/test_variant.py" \
  "python tools/module_writes.py check" \
  "python tools/test_patch_inventory.py" \
  "python tools/stamp.py test tools/test_chainlayout.py" \
  "python tools/stamp.py test tools/test_vtable_slots.py"
"""

[tasks.comment-audit]
description = "Report comments to review for staleness: history phrasing, code changed after its comment"
run = "python tools/comment_audit.py"

[tasks.build]
description = "Build the loader, feature plugins, injector and test host around fresh payloads"
depends = ["assemble"]
run = ["cargo build --release", "python tools/check_injector.py"]

[tasks.injector-check]
description = "Refresh, build and test the injector, then check every available DLL pair"
depends = ["assemble"]
run = [
  "cargo build --release -p defiance-pickup-inject",
  "cargo test -p defiance-pickup-inject",
  "python tools/test_check_injector.py",
  "python tools/check_injector.py",
]

[tasks.inject]
description = "Build everything, then wait for the game to start and patch it"
depends = ["build"]
run = 'target\release\defiance-pickup-inject.exe'
raw = true

[tasks.inject-loader]
description = "Build the full host, then start installed plugins through the EXE without a proxy DLL"
depends = ["loader"]
run = 'target\release\defiance-pickup-inject.exe --loader'
raw = true

[tasks.inject-scan]
description = "As inject, but scan reference-layout sites by signature; modern builds use their hash-selected units"
depends = ["build"]
run = 'target\release\defiance-pickup-inject.exe --force-scan'
raw = true

[tasks.test]
description = "Build everything, then run every native test and the self test (native tests skip when they passed on the same inputs; DEFIANCE_NO_STAMP=1 runs them all)"
depends = ["fmt-check", "loader", "crash-test"]
# Two parallel groups (tools/parallel.py). The first holds everything that
# reads only what the depends wrote: the Python checks, the parity builds (each
# with its own --target-dir), the moving-actions bindings (each writes its own
# out/*-sites.json) and the cargo tests (target/debug, which no check reads
# while target/release exists). The second holds the checks that read the
# first group's outputs: the parity DLLs and the out/*-sites.json files.
# patch_inventory.py check starts every plugin's writes per build: no overlaps,
# the same in either start order. test_moving_actions_animation.py also needs
# the PAK-derived assets, so it runs by hand.
run = [
  """python tools/parallel.py \
  "python tools/comment_audit.py --check" \
  "python tools/test_builds.py" \
  "python tools/test_stamp.py" \
  "python tools/test_check_injector.py" \
  "python tools/test_versions.py" \
  "python tools/test_layout.py" \
  "python tools/test_variant.py" \
  "python tools/module_writes.py check" \
  "python tools/test_patch_inventory.py" \
  "python tools/stamp.py test tools/test_chainlayout.py" \
  "python tools/stamp.py test tools/test_vtable_slots.py" \
  "python tools/stamp.py test tools/test_chooser.py" \
  "python tools/stamp.py test tools/test_move.py" \
  "cargo build --release --manifest-path plugins/vehicle-arrival/Cargo.toml --features parity-test --target-dir out/vehicle-arrival-parity" \
  "cargo test --manifest-path plugins/weapon-drops/Cargo.toml" \
  "cargo build --release --manifest-path plugins/weapon-drops/Cargo.toml --features parity-test --target-dir out/weapon-drops-parity" \
  "python tools/test_package_weapon_drops.py" \
  "python tools/stamp.py test tools/test_orders.py" \
  "python tools/stamp.py test tools/test_icon.py" \
  "python tools/stamp.py test tools/test_preview.py" \
  "python tools/stamp.py test tools/test_preview_subset.py" \
  "python tools/stamp.py test tools/test_building_tab.py" \
  "python tools/stamp.py test tools/test_selection.py" \
  "python tools/stamp.py test tools/test_region.py" \
  "python tools/stamp.py test tools/test_trace.py" \
  "python tools/stamp.py test tools/test_pose.py" \
  "python tools/stamp.py test tools/test_posture.py" \
  "python tools/stamp.py test tools/test_firing.py" \
  "python tools/stamp.py test tools/test_vehicle_dynamic.py" \
  "python tools/stamp.py test tools/test_vehicle_lifecycle.py" \
  "python tools/stamp.py test tools/test_vehicle_targeting.py" \
  "python tools/moving_actions_bindings.py" \
  "python tools/moving_actions_sync_bindings.py" \
  "python tools/moving_actions_render_sync_bindings.py" \
  "python tools/moving_grenades_bindings.py" \
  "cargo build --release --target-dir out/controls-parity -p defiance-plugin-core -p defiance-plugin-firing -p defiance-plugin-selection -p defiance-plugin-pickup --features defiance-plugin-core/parity-test,defiance-plugin-firing/parity-test,defiance-plugin-selection/parity-test,defiance-plugin-pickup/parity-test" \
  "python tools/stamp.py test tools/test_ammo.py" \
  "python tools/test_package_unit_inspection.py" \
  "python tools/test_stage.py" \
  "python tools/test_config.py" \
  "python tools/test_package.py" \
  "python tools/stamp.py test tools/test_plugins.py" \
  "python tools/stamp.py test tools/patch_inventory.py check" \
  "cargo test --workspace" \
  "cargo test --manifest-path plugins/legion-vehicle-hacking/Cargo.toml" \
  "python tools/sigs.py" \
  "python tools/check_injector.py"
""",
  """python tools/parallel.py \
  "python tools/test_vehicle_arrival.py out/vehicle-arrival-parity/release/defiance_plugin_vehicle_arrival.dll" \
  "python tools/test_weapon_drops.py out/weapon-drops-parity/release/defiance_plugin_weapon_drops.dll" \
  "python tools/test_moving_actions.py" \
  "python tools/test_moving_actions_sync.py" \
  "python tools/test_moving_actions_render_sync.py" \
  "python tools/test_moving_grenades.py" \
  "python tools/stamp.py test tools/test_pickup_rust.py out/controls-parity/release/defiance_plugin_feature_pickup.dll" \
  "python tools/stamp.py test tools/test_firing_rust.py out/controls-parity/release" \
  "python tools/stamp.py test tools/test_selection_rust.py out/controls-parity/release"
""",
]

[tasks.probe]
description = "Read the selection trace from the running game"
run = 'target\release\defiance-pickup-inject.exe --select-probe'
raw = true

[tasks.vehicle-arrival-test]
description = "Test the compiled vehicle arrival detour and code guards against all local stock DLLs; no game writes"
run = [
  "cargo build --release --manifest-path plugins/vehicle-arrival/Cargo.toml --features parity-test --target-dir out/vehicle-arrival-parity",
  "python tools/test_vehicle_arrival.py out/vehicle-arrival-parity/release/defiance_plugin_vehicle_arrival.dll",
]

[tasks.weapon-drops-build]
description = "Build the opt-in primary weapon drop prototype; does not install into the game"
run = "cargo build --release --manifest-path plugins/weapon-drops/Cargo.toml"

[tasks.weapon-drops-test]
description = "Test the primary death callback and site resolution; no game writes"
run = [
  "cargo test --manifest-path plugins/weapon-drops/Cargo.toml",
  "cargo build --release --manifest-path plugins/weapon-drops/Cargo.toml --features parity-test --target-dir out/weapon-drops-parity",
  "python tools/test_weapon_drops.py out/weapon-drops-parity/release/defiance_plugin_weapon_drops.dll",
  "python tools/test_package_weapon_drops.py",
]

[tasks.weapon-drops-package]
description = "Package primary drops with pickup locale overlays derived from DEFIANCE_GAME_DIR"
depends = ["weapon-drops-build"]
run = "python tools/package_weapon_drops.py"

# The loader branch: a proxy DLL that hosts plugins inside trm.exe. This is the
# native answer to BepInEx. Its built-in plugins embed their units from
# tools/variants. Player builds always assemble first; everything builds
# without the game's DLLs from the committed units. See crates/loader/src/lib.rs for the design.
[tasks.loader]
description = "Build the loader, built-in plugins and standalone plugins"
depends = ["assemble"]
# Each standalone plugin is its own workspace with its own target/, so they
# build at once (tools/parallel.py) beside the main workspace.
run = [
  """python tools/parallel.py \
  "cargo build --release" \
  "cargo build --release --manifest-path plugins/regroup/Cargo.toml" \
  "cargo build --release --manifest-path plugins/expanded-ammo-menu/Cargo.toml" \
  "cargo build --release --manifest-path plugins/squad-management-scroll/Cargo.toml" \
  "cargo build --release --manifest-path plugins/unit-inspection/Cargo.toml" \
  "cargo build --release --manifest-path plugins/ability-groups/Cargo.toml" \
  "cargo build --release --manifest-path plugins/legion-vehicle-hacking/Cargo.toml" \
  "cargo build --release --manifest-path plugins/vehicle-arrival/Cargo.toml" \
  "cargo build --release --manifest-path plugins/cover-markers/Cargo.toml" \
  "cargo build --release --manifest-path plugins/weapon-drops/Cargo.toml" \
  "cargo build --release --manifest-path plugins/moving-actions/Cargo.toml" \
  "cargo build --release --manifest-path plugins/moving-actions-animation/Cargo.toml" \
  "cargo build --release --manifest-path plugins/moving-actions-sync/Cargo.toml" \
  "cargo build --release --manifest-path plugins/moving-actions-render-sync/Cargo.toml" \
  "cargo build --release --manifest-path plugins/moving-grenades/Cargo.toml"
""",
  "python tools/check_injector.py",
  # Core's sidecar manifest comes from the loader's built-in table; the feature
  # plugins' are their committed plugins/*/*.plugin.json, checked and copied
  'target\release\manifest-gen.exe --out target\release',
]

[tasks.patch-inventory]
description = "Start every plugin against each build's stock DLLs: their writes must not overlap and must not depend on start order (record: python tools/patch_inventory.py record)"
depends = ["loader"]
run = "python tools/patch_inventory.py check"

[tasks.loader-test]
description = "Run the loader workspace's tests with fresh payloads"
depends = ["assemble"]
run = "cargo test --workspace"

[tasks.crash-test]
description = "Verify crash reports using disposable native and Rust panic subprocesses"
run = [
  "cargo build --release --target-dir out/crash-tests -p defiance-loader --features test-host",
  "cargo build --release --target-dir out/crash-tests --manifest-path tools/crash-plugin/Cargo.toml",
  "python tools/test_crash.py",
]

[tasks.loader-infra-test]
description = "Test loader infrastructure and standalone plugins without game DLLs"
depends = ["fmt-check"]
run = [
  "python tools/comment_audit.py --check",
  "cargo test --workspace --exclude defiance-plugin-core",
  "python tools/test_check_injector.py",
  "python tools/check_injector.py --metadata-only",
  "cargo test -p defiance-loader --features test-host --test hook_lifecycle --test hook_regressions",
  "python tools/test_versions.py",
  "python tools/test_layout.py",
  "python tools/test_variant.py",
  "python tools/module_writes.py check",
  "python tools/test_proxy.py",
  "cargo test --manifest-path plugins/regroup/Cargo.toml",
  "cargo test --manifest-path plugins/expanded-ammo-menu/Cargo.toml",
  "cargo test --manifest-path plugins/squad-management-scroll/Cargo.toml",
  "cargo test --manifest-path plugins/unit-inspection/Cargo.toml",
  "cargo test --manifest-path plugins/ability-groups/Cargo.toml",
  "cargo test --manifest-path plugins/legion-vehicle-hacking/Cargo.toml",
  "cargo test --manifest-path plugins/vehicle-arrival/Cargo.toml",
  "cargo test --manifest-path plugins/cover-markers/Cargo.toml",
  "cargo test --manifest-path plugins/weapon-drops/Cargo.toml",
  "cargo test --manifest-path plugins/moving-actions/Cargo.toml",
  "cargo test --manifest-path plugins/moving-actions-animation/Cargo.toml",
  "cargo test --manifest-path plugins/moving-actions-sync/Cargo.toml",
  "cargo test --manifest-path plugins/moving-actions-render-sync/Cargo.toml",
  "cargo test --manifest-path plugins/moving-grenades/Cargo.toml",
  "python tools/test_compose_infantry_animation.py",
  "python tools/test_package_moving_actions_animation.py",
  "python tools/test_package_squad_scroll.py",
  "python tools/test_build_resources.py",
  "python tools/test_package_unit_inspection.py",
  "python tools/test_stage.py",
  "python tools/test_config.py",
  "python tools/test_package.py",
]

[tasks.loader-proxy]
description = "Choose a proxy DLL from trm.exe, regenerate its forwarders, and rebuild"
depends = ["assemble"]
run = [
  "python tools/proxy.py --exe bin/trm.exe",
  "cargo build --release",
]

[tasks.loader-stage]
description = "Build, then copy the loader, plugins and generated companion mods into the game (set DEFIANCE_GAME_DIR, plus DEFIANCE_EXTRA_GAME_DIRS for more installs)"
depends = ["loader"]
run = "python tools/stage.py"

[tasks.plugins-stage]
description = "Build, then copy only the plugin DLLs and manifests into the game, which may be running (hot reload with [loader] hot_reload = true)"
depends = ["loader"]
run = "python tools/stage.py --plugins-only"

[tasks.loader-package]
description = "Package the loader and plugins, plus generated companion mods when DEFIANCE_GAME_DIR is set"
depends = ["loader"]
run = "python tools/package.py"

[tasks.loader-exe-package]
description = "Package EXE startup with the full plugin host and configuration, without a system-named proxy DLL"
depends = ["loader"]
run = "python tools/package.py --startup exe"

[tasks.loader-unstage]
description = "Remove the loader and its plugins from the game (DEFIANCE_GAME_DIR and DEFIANCE_EXTRA_GAME_DIRS)"
run = "python tools/stage.py --uninstall"

[tasks.moving-actions]
description = "Build the moving-action runtime plugins without game assets"
run = [
  "cargo build --release --manifest-path plugins/moving-actions/Cargo.toml",
  "cargo build --release --manifest-path plugins/moving-actions-animation/Cargo.toml",
  "cargo build --release --manifest-path plugins/moving-actions-sync/Cargo.toml",
  "cargo build --release --manifest-path plugins/moving-actions-render-sync/Cargo.toml",
  "cargo build --release --manifest-path plugins/moving-grenades/Cargo.toml",
]

[tasks.moving-actions-animation-mod]
description = "Derive the moving-animation companion from installed game PAKs"
run = 'python tools/package_moving_actions_animation.py --game "{{env.DEFIANCE_GAME_DIR}}"'

[tasks.squad-scroll]
description = "Build the optional squad-management scrolling plugin"
run = "cargo build --release --manifest-path plugins/squad-management-scroll/Cargo.toml"

[tasks.squad-scroll-test]
description = "Validate squad scrolling against local GOG/Steam fixtures and UI packaging"
depends = ["squad-scroll"]
run = [
  "cargo test --manifest-path plugins/squad-management-scroll/Cargo.toml",
  "python tools/test_squad_scroll.py",
  "python tools/test_package_squad_scroll.py",
]

[tasks.ammo-menu-test]
description = "Run the expanded-ammo-menu release DLL against every build's stock menu code"
run = [
  "cargo test --manifest-path plugins/expanded-ammo-menu/Cargo.toml",
  "cargo build --release --manifest-path plugins/expanded-ammo-menu/Cargo.toml",
  "python tools/test_expanded_ammo_menu.py",
]

[tasks.pickup-rust]
description = "Verify the default Rust pickup in a separate build directory"
depends = ["assemble"]
run = [
  "cargo test -p defiance-plugin-pickup --features rust-chooser",
  "cargo build --release --target-dir out/pickup-rust --features defiance-plugin-pickup/rust-chooser",
  "cargo build --release --target-dir out/pickup-parity -p defiance-plugin-pickup --features parity-test",
  "python tools/test_chooser.py",
  "python tools/test_pickup_rust.py out/pickup-parity/release/defiance_plugin_feature_pickup.dll",
  "python tools/test_plugins.py --rust-pickup",
]

[tasks.services-test]
description = "Build and test the game-independent plugin author/service examples"
run = [
  "cargo test -p defiance-loader -p defiance-api -p defiance-feature-sdk",
  "cargo build --release -p defiance-plugin-host-test --bin service-host --features patch-v1-test",
  "cargo build --release --manifest-path examples/services/Cargo.toml",
  "python tools/test_services.py",
  "python tools/test_api_header.py",
]

[tasks.rust-controls-test]
description = "Compare Rust firing controls and shared Core bindings with executable assembly"
depends = ["assemble"]
run = [
  "cargo test --workspace",
  "cargo build --release",
  "cargo build --release --target-dir out/controls-parity -p defiance-plugin-core -p defiance-plugin-firing -p defiance-plugin-selection --features defiance-plugin-core/parity-test,defiance-plugin-firing/parity-test,defiance-plugin-selection/parity-test",
  "python tools/test_firing.py",
  "python tools/test_firing_rust.py out/controls-parity/release",
  "python tools/test_selection_rust.py out/controls-parity/release",
  "python tools/test_plugins.py",
  "python tools/test_api_header.py",
]
