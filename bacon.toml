# bacon: a background checker that reruns a cargo job on every save. In a
# mise-activated shell (the PowerShell profile does this) it is on PATH here:
#
#   bacon                   check the main workspace (all targets)
#   bacon clippy            clippy on the main workspace
#   bacon test              its tests
#   bacon regroup           one standalone plugin workspace; also
#                           expanded-ammo-menu, squad-management-scroll
#
# In the TUI, `c` switches to clippy, `t` to tests, `g`/`e`/`s` to the three
# standalone plugins. plugins/core embeds out/payload*, so run
# `mise run assemble` once in a fresh checkout.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true

[jobs.regroup]
command = ["cargo", "check", "--manifest-path", "plugins/regroup/Cargo.toml", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["plugins/regroup", "crates"]

[jobs.expanded-ammo-menu]
command = ["cargo", "check", "--manifest-path", "plugins/expanded-ammo-menu/Cargo.toml", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["plugins/expanded-ammo-menu", "crates"]

[jobs.squad-management-scroll]
command = ["cargo", "check", "--manifest-path", "plugins/squad-management-scroll/Cargo.toml", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["plugins/squad-management-scroll", "crates"]

[keybindings]
c = "job:clippy"
t = "job:test"
g = "job:regroup"
e = "job:expanded-ammo-menu"
s = "job:squad-management-scroll"

